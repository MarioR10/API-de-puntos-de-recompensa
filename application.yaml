#Archivo base de configuraciones
server:
  port: 8080
  timeouts:
    #s: segundo; m: minuto; ms: milisegundos
    read_header: 5s
    read: 10s
    write: 15s
    idle: 1m
database:
  postgres:
    host: localhost
    port: 5432
    user: puntos
    dbname: puntos
    sslmode: disable

bcrypt:
  cost: 10 # costo  que se le pasa al metodo de bcrypt